<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funciones</title>
    <script>
        function suma(a, b) {
            return a+b;
        }

        function resta_nf(a, b) {
            console.log("El valor de la resta es:" + (a-b));
        }

        function resta_f(a, b) {
            console.log("El valor de la resta es:" + (a-b));
        }

        multiply = function(a, b){
            return a*b;
        }

    </script>
</head>
<body>
    
    <script>
        res = suma(5, 13);
        console.log(res); 
        res_mult=multiply(5, 14);
        console.log(res_mult);
        resta_nf(9,1);
        resta_f(10,2);
    </script>
</body>
</html>
