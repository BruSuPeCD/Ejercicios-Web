<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clases y objetos</title>
    <script>
        class Car{
            constructor(brand, model){
                this.brand = brand;
                this.model = model;
            }

            showInfo(){
                console.log("El coche es un ", this.brand + " " + this.model);
            }
        }


        class NominaAnual{
            constructor(name, salary){
                this.name = name;
                this.salary = salary;
            }

            getMonthlyPayment(){
                console.log(this.name, "cobrará", this.salary / 12, "cada mes en 12 pagas");

            }
            getProRatedPayment(){
                console.log(this.name, "cobrará", this.salary / 14, "cada mes en 14 pagas");
            }
        }
    </script>
</head>
<body>
    
    <script>
        let car = new Car("Ford", "Mustang");
        let car2 = new Car("Chevrolet", "Camaro");
        let car3 = new Car("Dodge", "Challenger");

        car.showInfo();
        car2.showInfo();    
        car3.showInfo();

        let nominaAnual = new NominaAnual("Bruno", 30000);
        nominaAnual.getMonthlyPayment();    
        nominaAnual.getProRatedPayment();
    </script>


</body>
</html>
