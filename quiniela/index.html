<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        header {
            display: flex; 
            justify-content: space-between;
            align-items: center;
            padding: 10px;
        }

        header div {
            flex-grow: 1;
            padding: 15px;
            margin: 0 20px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        .principal {
            background-color: #5B96C4;
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            padding: 2px 10px;
        }

        .información{
            border: none;
            font-size: 0.7em;
            padding: 4px 0;
            line-height: 1.3;
        }

        .ligas {
            border: 2px solid #5B96C4;
            color: #5B96C4;
            font-size: 1.1em;
            font-weight: bold;
            padding: 2px 10px;
        }
    </style>
</head>
<body>
    <header>
        <img src="./assets/Logo_de_Loterías_y_Apuestas_del_Estado.jpg" alt="Logo Loterias y Apuestas del Estado" width="150px">
        <div>
            <div class="principal">SENCILLO-MÚLTIPLE 261</div>
            <div class="información">SENCILLAS: Marque 14 signos por bloque (mínimo 2) en la zona de PRONÓSTICOS.<br> MÚLTIPLES: Marque los pronósticos sólo en bloque 1 y el número de Dobles y Triples en la zona de COMBINACIONES.</div>
            <div class="ligas">1.ª Liga BBVA / 2.ª Liga Adelante JORNADA: 1.ª FECHA: 23-8-15</div>
        </div>
        <img src="../quiniela/assets/La_Quiniela.jpg" alt="Logo La Quiniela" width="150px">
    </header>
</body>
</html>
