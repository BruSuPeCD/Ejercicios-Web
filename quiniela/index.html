<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiniela</title>
    <style type="text/css">
        header {
            display: flex; 
            justify-content: space-between;
            align-items: center;
            padding: 10px;
        }

        header img {
            margin: 0 35px;
        }

        .cabecera-central {
            flex-grow: 1;
            margin: 0 20px;
            font-family: "Arial Narrow", Arial, sans-serif;
        }

        .principal {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 11%;
            background-color: #5B96C4;
            color: white;
            font-size: 1.6em;
            font-weight: bold;
            padding: 8px 10px;
        }

        .informacion{
            border: none;
            font-size: 0.85em;     
            padding: 4px 10px;     
            line-height: 1.25;     
            letter-spacing: 0;     
            margin: 3px 0;
        }

        .ligas {
            display: flex;
            justify-content: space-between;
            border: 2px solid #5B96C4;
            color: #5B96C4;
            font-size: 1.1em;
            font-weight: bold;
            padding: 2px 10px;
        }

        .detalle-liga {
            font-size: 0.65em;
        }
    </style>
</head>
<body>
    <header>
        <img src="./assets/Logo_de_Loterías_y_Apuestas_del_Estado.jpg" alt="Logo Loterias y Apuestas del Estado" width="200">
        <div class="cabecera-central">
            <div class="principal">
                <span>SENCILLO-MÚLTIPLE</span>
                <span>261</span>
            </div>
            <div class="informacion">SENCILLAS: Marque 14 signos por bloque (mínimo 2) en la zona de PRONÓSTICOS.<br> MÚLTIPLES: Marque los pronósticos sólo en bloque 1 y el número de Dobles y Triples en la zona de COMBINACIONES.</div>
            <div class="ligas">
                <span>1.ª Liga BBVA / 2.ª Liga Adelante</span>
                <span><span class="detalle-liga">JORNADA:</span> 1.ª</span>
                <span><span class="detalle-liga">FECHA:</span> 23-8-15</span>
            </div>
        </div>
        <img src="../quiniela/assets/La_Quiniela.jpg" alt="Logo La Quiniela" width="200">
    </header>

    <main class="quiniela-cuerpo">
        <section class="zona-pronosticos">
        </section>

        <aside class="zona-combinaciones">
        </aside>
    </main>
</body>
</html>
