<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de tareas</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="container">
        <header>
            <span>📎</span>
            <h1>Mi lista de tareas</h1>
        </header>
        <div class="input-container">
            <input type="text" id="input-id" placeholder="Añade tu nueva tarea" autocomplete="off">
            <button id="btn-add" class="btn-submit" onclick="addTask()">
                <span>+</span> Agregar
            </button>
        </div>
        <ul id="task-list" class="task-list">
            <li class="task-item">
                <div class="task-container">
                    <button class="btn-check">✓</button>
                    <span class="task-name">Tarea pendiente</span>
                    </div> 
                    <button class="btn-delete">🪣 </button>
                </div>
            </li> 
            <li class="task-item done">
                <div class="task-container">
                    <button class="btn-check">✓</button>
                    <span class="task-name">Tarea completada</span>
                    </div> 
                    <button class="btn-delete">🪣 </button>
                </div>
            </li>    
        </ul>
    </div>
    <script src="./app.js"></script>

</body>
</html>
