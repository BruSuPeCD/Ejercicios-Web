<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta de satisfacción</title>
    <style>
        body {
            background-color: #f4f4f9;
            font-family: Arial;
            width: 70%;
            margin: 40px; 
            padding: 30px;
            border: 2px solid #212121;
            position: relative;
        }

        header {
            border-bottom: 3px double #4C55F1;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        nav {
            position: absolute;
            top: 50px; 
            right: 30px; 
        }

        nav a {
            color: #4C55F1;
            text-decoration: none;
        }

        nav a:hover {
            text-decoration: underline;
            color: #FF5214;
        }
    </style>
</head>
<body>
    <header>
        <img src="../images/assets/logo-campusdual.png" alt="logo campus dual" width="100" height="50">
    </header>
    
    <nav> <a href="../index.html">Volver atrás</a></nav>

    <ul>
        <li>
                <label for="login">Nombre: </label>
                <input type="text" name="login" placeholder="Tu nombre"/>
        </li>

        <li>
                <label for="satisfacción">Grado de satisfacción con la receta</label>
                <select name="satisfacción">
                    <option value="1">Muy decepcionado</option>
                    <option value="2">Decepcionado</option>
                    <option value="1">Normal</option>
                    <option value="2">Contento</option>
                    <option value="1">Muy contento</option>
                </select>
            </li>
    </ul>

    <button type="submit">Enviar</button>
    <button type="reset">Limpiar</button>
</body>
</html>
