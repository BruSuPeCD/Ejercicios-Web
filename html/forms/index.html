<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <nav><a href="../index.html">Volver atrás</a></nav>

    <form action="./index.html" method="get">
        <ul>
            <li>
                <label for="login">Usuario: </label>
                <input type="text" name="login" placeholder="Tu usuario de la aplicación"/>
            </li>

            <li>
                <label for="password">Contraseña: </label>
                <input type="password" name="password" placeholder="Contraseña"/>
            </li>

            <li>
                <label for="mail">Correo electrónico: </label>
                <input type="email" name="mail" placeholder="Correo electrónico"/>
            </li>
            <li>
                <label for="estimation">Estimación:</label>
                <select name="stimation">
                    <option value="1">XS</option>
                    <option value="2">S</option>
                    <option value="3">M</option>
                    <option value="4">L</option>
                    <option value="5">XL</option>
                </select>
            </li>

            <li>
                <label for="payment">Tipo de pago:</label>
                <input name="payment" type="radio" value="credit-card">Tarjeta de crédito</input>
                <input name="payment" type="radio" value="paypal">Paypal</input>
                <input name="payment" type="radio" value="bank-transfer">Transferencia</input>

            </li>

            <li>
                <label for="contact">Tipo de pago:</label>
                <input name="contact" type="checkbox" value="email">Correo</input>
                <input name="contact" type="checkbox" value="sms">SMS</input>
                <input name="contact" type="checkbox" value="call">Llamar</input>

            </li>
        </ul>
        <button type="submit">Enviar</button>
        <button type="reset">Limpiar</button>
    </form>
</body>
</html>
